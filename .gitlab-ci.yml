# Two stages. `check` needs nothing but a Python image, so it is also the
# simplest way to confirm your runner works at all. `build` needs a runner that
# can build images -- see docs/ci.md if it fails.

stages:
  - check
  - build

default:
  interruptible: true

# ---------------------------------------------------------------------------
# check -- no container runtime, no models, no network beyond PyPI
# ---------------------------------------------------------------------------

lint:
  stage: check
  image: python:3.10-slim
  script:
    - pip install --quiet ruff==0.16.8 mypy==1.18.2
    - ruff check .
    - ruff format --check .
    # --no-site-packages keeps the result independent of which numpy stubs the
    # image happens to resolve.
    - mypy --config-file pyproject.toml --no-site-packages asr serve.py fetch_models.py

test:
  stage: check
  image: python:3.10-slim
  script:
    # ctranslate2, faster-whisper and onnxruntime are all imported lazily or
    # behind guards, so the suite runs without them -- and without the 3 GB of
    # model weights.
    - pip install --quiet numpy pyjson5
    - python -m unittest discover -s tests -t . -v

# ---------------------------------------------------------------------------
# build -- image build, and a push only if this GitLab has its registry enabled
# ---------------------------------------------------------------------------

container:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: /certs/client
  before_script:
    # CI_REGISTRY only exists when the GitLab Container Registry is enabled.
    # Without it the image is still built and smoke-tested, just not pushed.
    - |
      if [ -n "$CI_REGISTRY" ]; then
        echo "registry enabled: $CI_REGISTRY_IMAGE"
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      else
        echo "no registry configured -- building and smoke-testing only"
      fi
  script:
    - docker build -f containerfile -t "asr-server:$CI_COMMIT_SHORT_SHA" .

    # Smoke test. The image has no model weights, so it cannot transcribe here;
    # what this proves is that every dependency resolved and the package imports
    # -- which is the failure mode a build actually catches.
    - docker run --rm "asr-server:$CI_COMMIT_SHORT_SHA" python serve.py --help
    - docker run --rm "asr-server:$CI_COMMIT_SHORT_SHA" python fetch_models.py --help
    - docker run --rm "asr-server:$CI_COMMIT_SHORT_SHA" python -c "import asr.server; print('imports ok')"

    - |
      if [ -n "$CI_REGISTRY" ]; then
        docker tag "asr-server:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
        if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
          docker tag "asr-server:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
          docker push "$CI_REGISTRY_IMAGE:latest"
        fi
        if [ -n "$CI_COMMIT_TAG" ]; then
          docker tag "asr-server:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
          docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        fi
      fi
