[project]
name = "asmr-asr-server"
version = "1.0.0"
description = "HTTP transcription server: an ASMR-tuned VAD driving faster-whisper"
requires-python = ">=3.14"

# Deliberately short. faster-whisper pulls ctranslate2, tokenizers, huggingface-hub
# and av; onnxruntime runs the VAD graph; pyjson5 exists only so the config file
# can keep its comments. transformers and librosa are NOT needed -- see README.
dependencies = [
    "faster-whisper>=1.0.0",
    "ctranslate2>=4.7.1",      # 4.7.1+ for the pruned-vocab ja models
    "onnxruntime>=1.17",       # upper bound dropped with the 3.10 floor
    "numpy>=2.0",
    "pyjson5>=1.6.0",
]

[project.optional-dependencies]
dev = ["ruff", "mypy"]
# The OpenVINO image only: uv sync --extra openvino. transformers and torch are
# what the short list above exists to avoid, so they stay opt-in. ov_backend.py is
# the only module that imports them, and it sits outside the asr package.
openvino = [
    "optimum-intel[openvino]>=2.2.0",  # brings optimum, openvino, openvino-tokenizers, nncf
    "transformers>=5.5,<5.6",
    "torch>=2.14",
    # A hard requirement of optimum-intel, declared here only so the index below
    # applies to it: uv sources bind to direct dependencies, not transitive ones.
    "torchvision>=0.29",
]

[tool.uv]
package = false

# torch and torchvision come from PyTorch's CPU index. The default index serves the
# CUDA build -- gigabytes of unused libraries on an Intel host -- and a torchvision
# resolved from there fails against it with "operator torchvision::nms does not
# exist". explicit = true keeps this index out of resolution for everything else,
# so no other package can be shadowed by it.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
# Matches requires-python. Note this makes the formatter adopt PEP 758
# unparenthesised except clauses -- `except OSError, ValueError:` lists two
# exception types, it does not bind one to a name the way Python 2's
# `except E, name:` did.
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length is the formatter's job
    "E402",   # conditional imports
    "SIM108", # ternaries are not always clearer
    "B028",   # explicit stacklevel not needed here
]

[tool.ruff.lint.isort]
known-first-party = ["asr"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
warn_unused_ignores = true
allow_untyped_defs = true
ignore_missing_imports = true
