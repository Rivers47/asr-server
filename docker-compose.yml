# Two profiles over one models volume. Fetch the weights once, then run either.
#
#   docker compose run --rm fetch          # populate ./models (~3 GB, one time)
#   docker compose up asr                  # CPU
#   docker compose --profile gpu up asr-gpu
#
# Port 8000 is bound to localhost only. There is no authentication -- change the
# binding deliberately, behind a reverse proxy.

services:
  fetch:
    build: .
    volumes:
      - ./models:/srv/models
    command: ["python", "fetch_models.py"]

  asr:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/srv/models:ro
      - ./generation_config.json5:/srv/generation_config.json5:ro
    restart: unless-stopped
    # VAD threads default to half this budget, read from the cgroup quota.
    deploy:
      resources:
        limits:
          cpus: "8"

  asr-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile.gpu
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/srv/models:ro
      - ./generation_config.json5:/srv/generation_config.json5:ro
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
